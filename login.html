<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antellay Space Login</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    :root {
        --primary-orange: #d57a44;
        --text-white: #ffffff;
        --text-gray: #a3a8b5;
        --bg-translucent: rgba(20, 25, 35, 0.5);
        --bg-input: rgba(15, 20, 30, 0.7);
        --border-color: rgba(255, 255, 255, 0.15);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
    }

    body {
        background-color: #050a15;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text-white);
        position: relative;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    body::before {
        content: "";
        position: fixed;
        top: -20px;
        left: -20px;
        right: -20px;
        bottom: -20px;
        background-image: url('assets/images/ChatGPT Image Aug 18, 2026, 09_59_21 PM.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(0);
        z-index: -1;
    }

    .container {
        width: 100%;
        max-width: 480px;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        zoom: 0.85;
    }

    /* Logo Section */
    .logo-container {
        margin-bottom: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .mark {
        width: 60px;
        height: 60px;
        margin-bottom: 15px;
    }

    .brand-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 8px;
        margin-bottom: 8px;
    }

    .brand-subtitle {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 6px;
        color: var(--text-white);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .brand-subtitle .dot {
        color: var(--primary-orange);
        font-size: 18px;
    }

    /* Tagline Section */
    .tagline-section {
        margin-bottom: 50px;
    }

    .tagline-main {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }

    .tagline-main .highlight {
        color: var(--primary-orange);
    }

    .tagline-sub {
        font-size: 15px;
        color: var(--text-gray);
        font-weight: 400;
    }

    /* Welcome Section */
    .welcome-section {
        margin-bottom: 30px;
    }

    .welcome-text {
        font-size: 13px;
        color: var(--primary-orange);
        letter-spacing: 3px;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .welcome-name {
        font-size: 36px;
        font-weight: 600;
        letter-spacing: 4px;
    }

    /* Form Section */
    .login-form {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 60px;
    }

    .input-group {
        position: relative;
        width: 100%;
    }

    .input-group svg {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        fill: var(--text-gray);
    }

    .input-group .icon-left {
        left: 15px;
    }

    .input-group .icon-right {
        right: 15px;
        cursor: pointer;
    }

    .input-group input {
        width: 100%;
        padding: 16px 45px;
        background-color: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-white);
        font-size: 15px;
        outline: none;
        transition: border 0.3s ease;
    }

    .input-group input:focus {
        border-color: var(--primary-orange);
    }

    .input-group input::placeholder {
        color: var(--text-gray);
    }

    .login-btn {
        width: 100%;
        padding: 16px;
        background-color: var(--primary-orange);
        color: var(--text-white);
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .login-btn:hover {
        background-color: #e6854b;
    }

    .forgot-password {
        font-size: 13px;
        color: var(--text-gray);
        text-decoration: none;
        margin-top: 5px;
    }

    .forgot-password:hover {
        color: var(--text-white);
    }

    .contact-btn {
        width: 100%;
        max-width: 380px;
        padding: 16px;
        background-color: transparent;
        color: var(--text-white);
        border: 1px solid var(--primary-orange);
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        transition: background 0.3s ease, color 0.3s ease;
        margin-bottom: 30px;
    }

    .contact-btn:hover {
        background-color: var(--primary-orange);
    }

    /* Footer Notice Section */
    .footer-notice {
        display: flex;
        background-color: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px 20px;
        width: 100%;
        max-width: 480px;
        text-align: left;
        align-items: center;
        gap: 20px;
    }

    .notice-badge {
        display: flex;
        flex-direction: column;
        padding-right: 20px;
        border-right: 1px solid var(--border-color);
        min-width: fit-content;
    }

    .notice-badge .mvp {
        color: var(--primary-orange);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }

    .notice-badge .early {
        color: var(--text-gray);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .notice-text {
        font-size: 12px;
        color: var(--text-gray);
        line-height: 1.5;
    }
</style>
</head>
<body>

<div class="container">

    <!-- Logo Section -->
    <div class="logo-container">
        <!-- Antellay logo from index.html -->
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M24 4 6 43l18-12 18 12L24 4Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
            <path d="M24 15v16M17 35l7-4 7 4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="brand-title">ANTELLAY</div>
        <div class="brand-subtitle"><span class="dot">&bull;</span> SPACE <span class="dot">&bull;</span></div>
    </div>

    <!-- Tagline -->
    <div class="tagline-section">
        <div class="tagline-main"><span class="highlight">AI-NATIVE</span> SPACE INTELLIGENCE</div>
        <div class="tagline-sub">Orbit. Data. Intelligence.</div>
    </div>

    <!-- Welcome -->
    <div class="welcome-section">
        <div class="welcome-text">WELCOME</div>
        <div class="welcome-name">VEER</div>
    </div>

    <!-- Form -->
    <form class="login-form">
        <div class="input-group">
            <!-- User Icon SVG -->
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>

            <input type="password" placeholder="Enter Password">

            <!-- Eye Off Icon SVG -->
            <svg class="icon-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        </div>

        <button type="submit" class="login-btn">LOGIN</button>
        <a href="#" class="forgot-password">Forgot Password?</a>
    </form>

    <!-- Contact Us -->
    <button type="button" class="contact-btn">CONTACT US</button>

    <!-- Footer Notice -->
    <div class="footer-notice">
        <div class="notice-badge">
            <span class="mvp">MVP BUILD</span>
            <span class="early">EARLY ACCESS</span>
        </div>
        <div class="notice-text">
            You are accessing an early MVP build of Antellay Space Intelligence Platform.
        </div>
    </div>

</div>

</body>
</html>
